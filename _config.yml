# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: ROB / KuanYen Huang
name: ROB
masthead_title: " "

description: >- # this means to ignore newlines until "baseurl:"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://12oi3.github.io" # the base hostname & protocol for your site, e.g. http://example.com
repository: "12OI3/12oi3.github.io"

# Build settings
theme: null
plugins:
  - jekyll-include-cache

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# mmistakes syuff
minimal_mistakes_skin: "rob" # "air", "aqua", "contrast", "dark", "default", "dirt", "neon", "mint", "plum", "sunrise"

# Site Footer
footer:
  links:
    - label: LinkedIn
      icon: fab fa-fw fa-linkedin
      url: &linkedinUrl https://www.linkedin.com/in/kuan-yen-huang-267079294/" target="_blank
    - label: GitHub
      icon: fab fa-fw fa-github
      url: &githubUrl https://github.com/12OI3" target="_blank
    - label: Itch.io
      icon: fas fa-fw fa-gamepad
      url: &itch https://intoxicat-studio.itch.io/" target="_blank
    - label: Resume
      icon: fas fa-fw fa-user
      url: &resume /assets/Huang_KuanYen_Resume.pdf" target="_blank
    - label: Email
      icon: fas fa-fw fa-envelope-square
      url: mailto:benbook90@gmail.com

# Collection
collections:
  project:
    output: true
    permalink: /:collection/:path/
  devlog:
    output: true
    permalink: /:collection/:path/
  article:
    output: true
    permalink: /:collection/:path/

atom_feed: # disable feed in footer
  hide: true

# Front Matter
defaults:
  - scope:
      path: ""
    values:
      css: "main"
  # _projects
  - scope:
      path: ""
      type: project
    values:
      layout: single
      author_profile: false
      share: false
      comments: true
  # _devlogs
  - scope:
      path: ""
      type: devlog
    values:
      layout: single
      author_profile: false
      classes: superwide
      share: false
      read_time: true
      comments: true
  # _articles
  - scope:
      path: ""
      type: article
    values:
      layout: single
      author_profile: false
      classes: superwide
      share: false
      read_time: true
      comments: true

comments:
  provider: "disqus"
  disqus:
    shortname: "12oi3"
